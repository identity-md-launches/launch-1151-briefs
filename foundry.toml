[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

# Pinned by version only. The launch workers and the verifier carry this compiler offline.
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false

# The launch compares deployed bytes without a metadata hash; the default hash is refused.
bytecode_hash = "none"
cbor_metadata = false

# No foreign-function interface and no filesystem access.
ffi = false
fs_permissions = []

[fuzz]
runs = 256

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
